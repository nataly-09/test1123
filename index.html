<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8fc" />
    <title>타자 기록표</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>:root {
  color: #20242f;
  background: #f4f6fb;
  font-family: "Noto Sans KR", sans-serif;
  font-synthesis: none;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  background:
    radial-gradient(circle at 80% 0%, rgba(109, 121, 255, 0.08), transparent 26rem),
    #f4f6fb;
}

.app-shell {
  width: min(1120px, calc(100% - 40px));
  margin: 0 auto;
  padding-bottom: 56px;
}

.topbar {
  height: 78px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #dde2ec;
}

.brand { display: flex; align-items: center; gap: 12px; }
.brand strong { font-size: 18px; letter-spacing: -0.3px; }

.brand-mark {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: #5667d9;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 3px;
  padding-bottom: 9px;
  box-shadow: 0 8px 18px rgba(86, 103, 217, 0.18);
}

.brand-mark span { width: 4px; border-radius: 4px; background: white; }
.brand-mark span:nth-child(1) { height: 11px; opacity: 0.72; }
.brand-mark span:nth-child(2) { height: 17px; }
.brand-mark span:nth-child(3) { height: 14px; opacity: 0.82; }

.text-button {
  border: 0;
  background: transparent;
  color: #5667d9;
  font-weight: 700;
  cursor: pointer;
}

.hero {
  min-height: 168px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.eyebrow, .step {
  margin: 0 0 8px;
  color: #6974b9;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.4px;
  text-transform: uppercase;
}

.hero h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); letter-spacing: -2px; }

.status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #e2e6ef;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  padding: 9px 13px;
  color: #727887;
  font-size: 13px;
}

.status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f4a62a; }
.status-pill.connected .status-dot { background: #35af78; }

.card {
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid #e7eaf2;
  border-radius: 18px;
  box-shadow: 0 14px 40px rgba(48, 57, 91, 0.055);
}

.login-card { max-width: 760px; margin: 8px auto 0; padding: 32px; }

.section-heading, .chart-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.section-heading h2, .chart-header h2 {
  margin: 0;
  font-size: 22px;
  letter-spacing: -0.5px;
}

.section-heading > p { margin: 14px 0 0; color: #8b909d; font-size: 13px; }

.login-form {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 16px;
  align-items: end;
  margin-top: 28px;
}

label { color: #626777; font-size: 13px; font-weight: 700; }

input {
  width: 100%;
  height: 48px;
  margin-top: 8px;
  border: 1px solid #dde2ec;
  border-radius: 10px;
  background: #fbfcfe;
  padding: 0 14px;
  color: #252934;
  font: inherit;
  font-size: 15px;
  outline: none;
  transition: 0.18s ease;
}

input:focus { border-color: #7884df; box-shadow: 0 0 0 3px rgba(120, 132, 223, 0.12); }

.primary-button {
  height: 48px;
  border: 0;
  border-radius: 10px;
  background: #5667d9;
  color: white;
  padding: 0 22px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(86, 103, 217, 0.16);
  white-space: nowrap;
  transition: transform 0.15s ease, background 0.15s ease;
}

.primary-button:hover { background: #495bc9; transform: translateY(-1px); }
.form-message { min-height: 18px; margin: 12px 0 -8px; color: #d05d66; font-size: 13px; }
.form-message.success { color: #31956a; }

.dashboard { margin-top: 8px; }
.dashboard-grid { display: grid; grid-template-columns: 1.6fr 0.8fr; gap: 18px; }
.record-card, .summary-card, .chart-card { padding: 28px; }

.record-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 14px; align-items: end; margin-top: 24px; }
.input-with-unit { position: relative; }
.input-with-unit input { padding-right: 44px; }
.input-with-unit span { position: absolute; right: 14px; bottom: 14px; color: #9a9fab; font-size: 13px; }
.record-actions { display: flex; gap: 8px; }
.secondary-button {
  height: 48px;
  border: 1px solid #dde2ec;
  border-radius: 10px;
  background: white;
  color: #666d7b;
  padding: 0 14px;
  font-weight: 700;
  cursor: pointer;
}

.summary-label { margin: 4px 0 24px; color: #777d8d; font-size: 13px; font-weight: 700; }
.summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.summary-row div { display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 5px; }
.summary-row span { flex-basis: 100%; color: #9297a4; font-size: 12px; }
.summary-row strong { font-size: 34px; letter-spacing: -1.5px; }
.summary-row small { color: #9297a4; }

.chart-card { margin-top: 18px; }
.legend { display: flex; gap: 18px; color: #777d8d; font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 7px; }
.legend i { width: 18px; height: 3px; border-radius: 4px; }
.korean-line { background: #5667d9; }
.english-line { background: #f0a44b; }
.chart-wrap { position: relative; height: 280px; margin-top: 16px; }
#chart { width: 100%; height: 100%; overflow: visible; }
.empty-chart { position: absolute; inset: 0; display: grid; place-items: center; color: #a2a6b1; font-size: 13px; }

.grid-line { stroke: #edf0f5; stroke-width: 1; }
.axis-label { fill: #9da2ad; font-size: 11px; }
.korean-path { fill: none; stroke: #5667d9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.english-path { fill: none; stroke: #f0a44b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.korean-dot { fill: white; stroke: #5667d9; stroke-width: 3; }
.english-dot { fill: white; stroke: #f0a44b; stroke-width: 3; }

.history-card { margin-top: 18px; padding: 28px; }
.history-list { margin-top: 16px; }
.history-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr auto;
  align-items: center;
  min-height: 58px;
  border-top: 1px solid #edf0f5;
  color: #626777;
  font-size: 13px;
}
.history-row:first-child { border-top: 0; }
.history-row strong { color: #252934; }
.history-row .edit-button {
  border: 1px solid #dce1ef;
  border-radius: 8px;
  background: #f8f9fd;
  color: #5667d9;
  padding: 8px 12px;
  font-weight: 800;
  cursor: pointer;
}
.empty-history { padding: 18px 0 4px; color: #a2a6b1; font-size: 13px; }

@media (max-width: 760px) {
  .app-shell { width: min(100% - 24px, 1120px); }
  .hero { min-height: 150px; }
  .status-pill { display: none; }
  .login-form, .record-form { grid-template-columns: 1fr; }
  .dashboard-grid { grid-template-columns: 1fr; }
  .login-card, .record-card, .summary-card, .chart-card { padding: 22px; }
  .history-card { padding: 22px; }
  .section-heading > p { display: none; }
  .chart-wrap { height: 240px; }
  .history-row { grid-template-columns: 1fr 1fr auto; gap: 8px; padding: 10px 0; }
  .history-row span:nth-child(3) { grid-column: 2; }
}
</style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
          <strong>타자 기록표</strong>
        </div>
        <button class="text-button" id="logoutButton" type="button" hidden>다른 학번으로 보기</button>
      </header>

      <section class="hero">
        <div>
          <p class="eyebrow">나의 타자 성장 기록</p>
          <h1>오늘의 기록을 남겨보세요</h1>
        </div>
        <div class="status-pill" id="storageStatus">
          <span class="status-dot"></span>
          로컬 저장 모드
        </div>
      </section>

      <section class="card login-card" id="loginSection">
        <div class="section-heading">
          <div>
            <p class="step">01</p>
            <h2>학번으로 시작하기</h2>
          </div>
          <p>처음이라면 비밀번호를 새로 지정하세요.</p>
        </div>

        <form id="loginForm" class="login-form">
          <label>
            학번
            <input id="studentId" name="studentId" type="text" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="예: 1204" required />
          </label>
          <label>
            비밀번호 4자리
            <input id="password" name="password" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="숫자 4자리" required />
          </label>
          <button class="primary-button" type="submit">기록 보기</button>
        </form>
        <p class="form-message" id="loginMessage" role="alert"></p>
      </section>

      <section class="dashboard" id="dashboard" hidden>
        <div class="dashboard-grid">
          <article class="card record-card">
            <div class="section-heading">
              <div>
                <p class="step">02</p>
                <h2 id="recordTitle">새 기록 입력</h2>
              </div>
              <p id="todayLabel"></p>
            </div>

            <form id="recordForm" class="record-form">
              <label>
                기록 날짜
                <input id="recordDate" name="recordDate" type="date" required />
              </label>
              <label>
                한글 타자
                <div class="input-with-unit">
                  <input id="koreanScore" name="koreanScore" type="number" min="0" max="9999" step="1" placeholder="0" required />
                  <span>타</span>
                </div>
              </label>
              <label>
                영어 타자
                <div class="input-with-unit">
                  <input id="englishScore" name="englishScore" type="number" min="0" max="9999" step="1" placeholder="0" required />
                  <span>타</span>
                </div>
              </label>
              <div class="record-actions">
                <button class="primary-button" id="saveRecordButton" type="submit">기록 저장</button>
                <button class="secondary-button" id="cancelEditButton" type="button" hidden>취소</button>
              </div>
            </form>
            <p class="form-message" id="recordMessage" role="status"></p>
          </article>

          <article class="card summary-card">
            <p class="summary-label">최고 기록</p>
            <div class="summary-row">
              <div>
                <span>한글</span>
                <strong id="koreanBest">0</strong>
                <small>타</small>
              </div>
              <div>
                <span>영어</span>
                <strong id="englishBest">0</strong>
                <small>타</small>
              </div>
            </div>
          </article>
        </div>

        <article class="card chart-card">
          <div class="chart-header">
            <div>
              <p class="step">03</p>
              <h2>성장 그래프</h2>
            </div>
            <div class="legend">
              <span><i class="korean-line"></i> 한글</span>
              <span><i class="english-line"></i> 영어</span>
            </div>
          </div>
          <div class="chart-wrap" id="chartWrap">
            <svg id="chart" role="img" aria-label="날짜별 한글 및 영어 타자 기록 그래프"></svg>
            <div class="empty-chart" id="emptyChart">
              아직 저장된 기록이 없습니다.
            </div>
          </div>
        </article>

        <article class="card history-card">
          <div class="chart-header">
            <div>
              <p class="step">04</p>
              <h2>기록 목록</h2>
            </div>
          </div>
          <div class="history-list" id="historyList"></div>
        </article>
      </section>
    </main>

    <script>// Supabase 설정을 받은 뒤 아래 값을 채우세요.
window.SUPABASE_CONFIG = {
  url: "",
  anonKey: ""
};
</script>
    <script>const state = {
  studentId: null,
  records: [],
  editingDate: null
};

const loginForm = document.querySelector("#loginForm");
const recordForm = document.querySelector("#recordForm");
const loginSection = document.querySelector("#loginSection");
const dashboard = document.querySelector("#dashboard");
const logoutButton = document.querySelector("#logoutButton");
const storageStatus = document.querySelector("#storageStatus");

const isSupabaseConfigured = () =>
  window.SUPABASE_CONFIG?.url &&
  window.SUPABASE_CONFIG?.anonKey &&
  window.SUPABASE_CONFIG.url !== "https://YOUR_PROJECT.supabase.co";

async function sha256(value) {
  const bytes = new TextEncoder().encode(value);
  const digest = await crypto.subtle.digest("SHA-256", bytes);
  return Array.from(new Uint8Array(digest), (byte) =>
    byte.toString(16).padStart(2, "0")
  ).join("");
}

async function supabaseRequest(path, options = {}) {
  const { url, anonKey } = window.SUPABASE_CONFIG;
  const response = await fetch(`${url}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: anonKey,
      Authorization: `Bearer ${anonKey}`,
      "Content-Type": "application/json",
      Prefer: "return=representation",
      ...options.headers
    }
  });

  if (!response.ok) {
    const error = await response.json().catch(() => ({}));
    throw new Error(error.message || "데이터베이스 요청에 실패했습니다.");
  }
  if (response.status === 204) return null;
  return response.json();
}

function localKey(studentId) {
  return `typing-record-${studentId}`;
}

function readLocalStudent(studentId) {
  return JSON.parse(localStorage.getItem(localKey(studentId)) || "null");
}

function writeLocalStudent(studentId, passwordHash, records) {
  localStorage.setItem(localKey(studentId), JSON.stringify({
    studentId,
    passwordHash,
    records
  }));
}

async function authenticateStudent(studentId, password) {
  const passwordHash = await sha256(password);

  if (!isSupabaseConfigured()) {
    const existing = readLocalStudent(studentId);
    if (!existing) {
      writeLocalStudent(studentId, passwordHash, []);
      return [];
    }
    if (existing.passwordHash !== passwordHash) {
      throw new Error("비밀번호가 학번과 일치하지 않습니다.");
    }
    return existing.records || [];
  }

  storageStatus.classList.add("connected");
  storageStatus.innerHTML = '<span class="status-dot"></span> Supabase 연결됨';

  const students = await supabaseRequest(
    `students?student_id=eq.${encodeURIComponent(studentId)}&select=student_id,password_hash`
  );

  if (students.length === 0) {
    await supabaseRequest("students", {
      method: "POST",
      body: JSON.stringify({ student_id: studentId, password_hash: passwordHash })
    });
  } else if (students[0].password_hash !== passwordHash) {
    throw new Error("비밀번호가 학번과 일치하지 않습니다.");
  }

  return supabaseRequest(
    `typing_records?student_id=eq.${encodeURIComponent(studentId)}&select=korean_score,english_score,recorded_at&order=recorded_at.asc`
  );
}

async function saveRecord(koreanScore, englishScore, date) {
  const record = {
    korean_score: koreanScore,
    english_score: englishScore,
    recorded_at: date
  };

  if (!isSupabaseConfigured()) {
    const existing = readLocalStudent(state.studentId);
    existing.records = [
      ...(existing.records || []).filter((item) => item.recorded_at !== date),
      record
    ].sort((a, b) => a.recorded_at.localeCompare(b.recorded_at));
    writeLocalStudent(state.studentId, existing.passwordHash, existing.records);
    return existing.records;
  }

  await supabaseRequest(
    `typing_records?on_conflict=student_id,recorded_at`,
    {
      method: "POST",
      headers: { Prefer: "resolution=merge-duplicates,return=representation" },
      body: JSON.stringify({
        student_id: state.studentId,
        korean_score: koreanScore,
        english_score: englishScore,
        recorded_at: date
      })
    }
  );

  return supabaseRequest(
    `typing_records?student_id=eq.${encodeURIComponent(state.studentId)}&select=korean_score,english_score,recorded_at&order=recorded_at.asc`
  );
}

function normalizeRecords(records) {
  return records.map((record) => ({
    korean: Number(record.korean_score),
    english: Number(record.english_score),
    date: record.recorded_at
  }));
}

function renderDashboard(records) {
  state.records = normalizeRecords(records);
  dashboard.hidden = false;
  loginSection.hidden = true;
  logoutButton.hidden = false;

  const recordDate = document.querySelector("#recordDate");
  const today = toDateInputValue(new Date());
  recordDate.max = today;
  if (!recordDate.value) recordDate.value = today;

  const koreanBest = state.records.reduce((best, item) => Math.max(best, item.korean), 0);
  const englishBest = state.records.reduce((best, item) => Math.max(best, item.english), 0);
  document.querySelector("#koreanBest").textContent = koreanBest.toLocaleString("ko-KR");
  document.querySelector("#englishBest").textContent = englishBest.toLocaleString("ko-KR");
  document.querySelector("#todayLabel").textContent =
    new Intl.DateTimeFormat("ko-KR", { year: "numeric", month: "long", day: "numeric" }).format(new Date());
  renderChart();
  renderHistory();
}

function toDateInputValue(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
}

function renderHistory() {
  const historyList = document.querySelector("#historyList");
  if (!state.records.length) {
    historyList.innerHTML = '<div class="empty-history">아직 저장된 기록이 없습니다.</div>';
    return;
  }

  historyList.innerHTML = [...state.records].reverse().map((record) =>
    `<div class="history-row">
      <strong>${shortDate(record.date)}</strong>
      <span>한글 ${record.korean.toLocaleString("ko-KR")}타</span>
      <span>영어 ${record.english.toLocaleString("ko-KR")}타</span>
      <button class="edit-button" type="button" data-date="${record.date}">수정</button>
    </div>`
  ).join("");

  historyList.querySelectorAll(".edit-button").forEach((button) => {
    button.addEventListener("click", () => startEditing(button.dataset.date));
  });
}

function startEditing(date) {
  const record = state.records.find((item) => item.date === date);
  if (!record) return;

  state.editingDate = date;
  const recordDate = document.querySelector("#recordDate");
  recordDate.value = date;
  recordDate.disabled = true;
  document.querySelector("#koreanScore").value = record.korean;
  document.querySelector("#englishScore").value = record.english;
  document.querySelector("#recordTitle").textContent = "기록 수정";
  document.querySelector("#saveRecordButton").textContent = "수정 저장";
  document.querySelector("#cancelEditButton").hidden = false;
  document.querySelector("#recordMessage").textContent = "";
  document.querySelector("#recordForm").scrollIntoView({ behavior: "smooth", block: "center" });
}

function resetEditing() {
  state.editingDate = null;
  recordForm.reset();
  const recordDate = document.querySelector("#recordDate");
  recordDate.disabled = false;
  recordDate.value = toDateInputValue(new Date());
  document.querySelector("#recordTitle").textContent = "새 기록 입력";
  document.querySelector("#saveRecordButton").textContent = "기록 저장";
  document.querySelector("#cancelEditButton").hidden = true;
  document.querySelector("#recordMessage").textContent = "";
}

function shortDate(dateString) {
  const date = new Date(`${dateString}T00:00:00`);
  return new Intl.DateTimeFormat("ko-KR", { month: "numeric", day: "numeric" }).format(date);
}

function renderChart() {
  const svg = document.querySelector("#chart");
  const emptyChart = document.querySelector("#emptyChart");
  const records = state.records;
  emptyChart.hidden = records.length > 0;
  svg.innerHTML = "";
  if (!records.length) return;

  const width = svg.clientWidth || 800;
  const height = svg.clientHeight || 280;
  const margin = { top: 18, right: 18, bottom: 36, left: 46 };
  const innerWidth = width - margin.left - margin.right;
  const innerHeight = height - margin.top - margin.bottom;
  const maxValue = Math.max(
    100,
    ...records.map((item) => Math.max(item.korean, item.english))
  );
  const roundedMax = Math.ceil(maxValue / 100) * 100;

  const ns = "http://www.w3.org/2000/svg";
  const add = (tag, attributes, text) => {
    const element = document.createElementNS(ns, tag);
    Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
    if (text != null) element.textContent = text;
    svg.appendChild(element);
    return element;
  };

  const x = (index) =>
    records.length === 1
      ? margin.left + innerWidth / 2
      : margin.left + (index * innerWidth) / (records.length - 1);
  const y = (value) => margin.top + innerHeight - (value / roundedMax) * innerHeight;

  for (let index = 0; index <= 4; index++) {
    const value = (roundedMax / 4) * index;
    const lineY = y(value);
    add("line", { x1: margin.left, y1: lineY, x2: width - margin.right, y2: lineY, class: "grid-line" });
    add("text", { x: margin.left - 12, y: lineY + 4, "text-anchor": "end", class: "axis-label" }, Math.round(value).toLocaleString("ko-KR"));
  }

  records.forEach((record, index) => {
    add("text", {
      x: x(index),
      y: height - 8,
      "text-anchor": "middle",
      class: "axis-label"
    }, shortDate(record.date));
  });

  const makePath = (field, className) =>
    records.map((record, index) => `${index === 0 ? "M" : "L"} ${x(index)} ${y(record[field])}`).join(" ");

  if (records.length) {
    add("path", { d: makePath("korean", "korean-path"), class: "korean-path" });
    add("path", { d: makePath("english", "english-path"), class: "english-path" });
    records.forEach((record, index) => {
      add("circle", { cx: x(index), cy: y(record.korean), r: 5, class: "korean-dot" });
      add("circle", { cx: x(index), cy: y(record.english), r: 5, class: "english-dot" });
    });
  }
}

loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = document.querySelector("#loginMessage");
  const studentId = document.querySelector("#studentId").value.trim();
  const password = document.querySelector("#password").value;
  message.className = "form-message";

  if (!/^\d{4}$/.test(studentId) || !/^\d{4}$/.test(password)) {
    message.textContent = "학번과 비밀번호는 숫자 4자리로 입력해 주세요.";
    return;
  }

  try {
    const records = await authenticateStudent(studentId, password);
    state.studentId = studentId;
    renderDashboard(records);
  } catch (error) {
    message.textContent = error.message;
  }
});

recordForm.addEventListener("submit", async (event) => {
  event.preventDefault();
  const message = document.querySelector("#recordMessage");
  const date = document.querySelector("#recordDate").value;
  const koreanScore = Number(document.querySelector("#koreanScore").value);
  const englishScore = Number(document.querySelector("#englishScore").value);
  message.className = "form-message";

  if (!date) {
    message.textContent = "기록 날짜를 선택해 주세요.";
    return;
  }

  if (!Number.isFinite(koreanScore) || !Number.isFinite(englishScore) ||
      koreanScore < 0 || englishScore < 0) {
    message.textContent = "0 이상의 타자 기록을 입력해 주세요.";
    return;
  }

  try {
    const records = await saveRecord(koreanScore, englishScore, date);
    renderDashboard(records);
    resetEditing();
    message.className = "form-message success";
    message.textContent = "기록이 저장되었습니다.";
  } catch (error) {
    message.textContent = error.message;
  }
});

document.querySelector("#cancelEditButton").addEventListener("click", resetEditing);

logoutButton.addEventListener("click", () => {
  state.studentId = null;
  state.records = [];
  dashboard.hidden = true;
  loginSection.hidden = false;
  logoutButton.hidden = true;
  loginForm.reset();
  document.querySelector("#loginMessage").textContent = "";
});

window.addEventListener("resize", () => {
  if (!dashboard.hidden) renderChart();
});
</script>
  </body>
</html>
